<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A252D">
<meta name="robots" content="noindex, nofollow">
<title>Sales CRM · Machinery Specialist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EEF1F3; color: #1A252D; font: 16px/1.45 Barlow, system-ui, sans-serif; }
  .boot { max-width: 460px; margin: 0 auto; padding: 40px 20px; text-align: center; }
  .blogo { width: 200px; max-width: 70%; }
  .boot h1 { font: 700 30px 'Barlow Condensed', sans-serif; margin: 10px 0 18px; }
  .bbtn { display: block; width: 100%; margin: 14px 0; padding: 14px; font: 600 17px Barlow, sans-serif; color: #fff; background: #1A252D; border: 0; border-radius: 6px; }
  .blink { background: none; border: 0; color: #2F6FB3; text-decoration: underline; font-size: 15px; }
  .binp { width: 100%; box-sizing: border-box; padding: 12px; font-size: 17px; border: 2px solid #1A252D; border-radius: 6px; }
  .berr { color: #9B1C1C; font-weight: 600; }
  .bpath { font-size: 13px; color: #5D6E7A; margin: 6px 0; word-break: break-all; }
  .blist { text-align: left; border: 1px solid #ccd3d8; border-radius: 8px; background: #fff; overflow: hidden; }
  .bitem { display: block; width: 100%; text-align: left; padding: 13px 14px; border: 0; border-bottom: 1px solid #e3e7ea; background: #fff; font: 16px Barlow, sans-serif; }
  .small { font-size: 13px; color: #5D6E7A; } code { word-break: break-all; background: #fff; padding: 2px 4px; }
  .bspin { width: 28px; height: 28px; margin: 18px auto; border: 3px solid #ccd3d8; border-top-color: #1A252D; border-radius: 50%; animation: bs 0.8s linear infinite; } @keyframes bs { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"><div class="boot"><div class="bspin"></div></div></div>
<script src="config.js"></script>
<script src="dropbox-fs.js"></script>
<script src="boot.js"></script>
</body>
</html>
